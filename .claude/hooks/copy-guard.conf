# copy-guard.conf -- read by .claude/hooks/copy-guard.sh
#
# protect <ERE>  a database file or data directory that holds personal data
# allow   <ERE>  a copy destination the system's retention routine sweeps
#
# Extended regular expressions, matched against each command segment with quotes removed.
# With no `protect` line the guard is off. Fill this in when you connect a system that
# holds personal data (people, attendance, payroll, health, client contacts), together with
# the table in section 4 of .claude/rules/personal-data-db-access.md.
#
# Examples (uncomment and adapt):
#
# protect (^|[^A-Za-z0-9_.-])people\.db([^A-Za-z0-9_-]|$)
# protect my-app/data(/|[[:space:]]|$)
# protect prod-db-host
# allow   data/backups/people-[0-9]{8}-[0-9]{4,6}(-[A-Za-z0-9._-]+)?\.db
